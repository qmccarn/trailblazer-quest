/* ---------- helpers ---------- */
const PAL = ['#e0f8d0', '#88c070', '#346856', '#081820'];
const VW = 160, VH = 144, TS = 16;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
function fmt(s) { return String(s).replace(/\{(\w+)\}/g, (m, k) => (CAST[k] !== undefined ? CAST[k] : m)); }
function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
function rect(x, y, w, h, c) { ctx.fillStyle = PAL[c]; ctx.fillRect(x, y, w, h); }
function setFont(size) { ctx.font = 'bold ' + (size || 7) + 'px "Courier New",monospace'; }
function text(s, x, y, c, align, size) {
  setFont(size); ctx.fillStyle = PAL[c === undefined ? 3 : c];
  ctx.textAlign = align || 'left'; ctx.textBaseline = 'top'; ctx.fillText(s, x, y);
}
function wrap(s, maxW, size) {
  setFont(size);
  const out = [];
  String(s).split('\n').forEach(para => {
    if (para === '') { out.push(''); return; }
    const words = para.split(' ');
    let line = '';
    words.forEach(w => {
      const t = line ? line + ' ' + w : w;
      if (ctx.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t;
    });
    out.push(line);
  });
  return out;
}
function box(x, y, w, h) {
  rect(x, y, w, h, 3); rect(x + 1, y + 1, w - 2, h - 2, 2); rect(x + 2, y + 2, w - 4, h - 4, 0);
}
function bar(x, y, w, cur, max, c) {
  rect(x, y, w, 5, 3); rect(x + 1, y + 1, w - 2, 3, 0);
  const f = Math.max(0, Math.min(1, cur / max));
  const col = f > 0.5 ? 2 : f > 0.2 ? 1 : 3;
  rect(x + 1, y + 1, Math.round((w - 2) * f), 3, c === undefined ? col : c);
}

/* ---------- sound (tiny blips, can be muted) ---------- */
let AC = null, MUTE = false;
function sfx(f, d, type, vol, slide) {
  if (MUTE) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.linearRampToValueAtTime(f + slide, t + (d || 0.06));
    g.gain.setValueAtTime(vol || 0.035, t); g.gain.exponentialRampToValueAtTime(0.0001, t + (d || 0.06));
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + (d || 0.06));
  } catch (e) { /* audio unavailable */ }
}
function jingle(notes) { notes.forEach((f, i) => setTimeout(() => sfx(f, 0.12, 'square', 0.04), i * 110)); }

/* ---------- input ---------- */
const held = {}, hitq = {};
const KEYMAP = { ArrowUp: 'up', w: 'up', W: 'up', ArrowDown: 'down', s: 'down', S: 'down', ArrowLeft: 'left', a: 'left', A: 'left',
  ArrowRight: 'right', d: 'right', D: 'right', z: 'a', Z: 'a', ' ': 'a', Enter: 'a', x: 'b', X: 'b', Backspace: 'b',
  m: 'menu', M: 'menu', Escape: 'menu', Tab: 'menu' };
const tapq = [];
function press(b) { if (!held[b]) hitq[b] = true; held[b] = true; if (['up', 'down', 'left', 'right'].includes(b) && tapq.length < 3) tapq.push(b); }
function release(b) { held[b] = false; }
function hit(b) { const v = hitq[b]; hitq[b] = false; return !!v; }
window.addEventListener('keydown', e => { const b = KEYMAP[e.key]; if (b) { e.preventDefault(); press(b); } });
window.addEventListener('keyup', e => { const b = KEYMAP[e.key]; if (b) { e.preventDefault(); release(b); } });
document.querySelectorAll('[data-b]').forEach(el => {
  const b = el.dataset.b;
  const on = e => { e.preventDefault(); press(b); el.classList.add('on'); };
  const off = e => { e.preventDefault(); release(b); el.classList.remove('on'); };
  el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off);
  el.addEventListener('pointerleave', off); el.addEventListener('pointercancel', off);
});

/* ---------- maps ---------- */
function grid(w, h, f) { const g = []; for (let y = 0; y < h; y++) g.push(new Array(w).fill(f)); return g; }
function building(g, x, y, w, doorX) {
  for (let i = 0; i < w; i++) {
    g[y][x + i] = 'R';
    g[y + 1][x + i] = (i === 1 || i === w - 2) ? 'V' : 'W';
    g[y + 2][x + i] = 'W';
  }
  g[y + 2][doorX] = 'D';
}
const BLOCK = new Set(['T', 'R', 'W', 'V', 'B', '#', 'c', 's', 'n']);
const DOORS = [3, 9, 15, 21];

function makeOver() {
  const w = 26, h = 20, g = grid(w, h, '.');
  for (let x = 0; x < w; x++) { g[0][x] = 'T'; g[h - 1][x] = 'T'; }
  for (let y = 0; y < h; y++) { g[y][0] = 'T'; g[y][w - 1] = 'T'; }
  DOORS.forEach(dx => { building(g, dx - 2, 2, 5, dx); building(g, dx - 2, 10, 5, dx); });
  DOORS.forEach(dx => {
    for (let y = 5; y <= 7; y++) g[y][dx] = '_';
    for (let y = 13; y <= 14; y++) g[y][dx] = '_';
  });
  for (let x = 3; x <= 22; x++) { g[8][x] = '_'; g[15][x] = '_'; }
  for (let y = 8; y <= 15; y++) g[y][12] = '_';
  [[2, 17], [3, 17], [22, 17], [23, 17], [5, 18], [20, 18], [7, 17], [18, 17]].forEach(p => { g[p[1]][p[0]] = 'T'; });
  return { w, h, g, name: 'over', npcs: [], warps: [], interact: {}, triggers: [] };
}
function makeRoom(name, doorX) {
  const w = 10, h = 9, g = grid(w, h, 'f');
  for (let x = 0; x < w; x++) { g[0][x] = '#'; g[1][x] = '#'; g[h - 1][x] = '#'; }
  for (let y = 0; y < h; y++) { g[y][0] = '#'; g[y][w - 1] = '#'; }
  g[1][2] = 'B'; g[1][7] = 'B';
  g[h - 1][doorX] = 'd';
  return { w, h, g, name, npcs: [], warps: [], interact: {}, triggers: [] };
}

const bmoves = () => ({ type: 'bmoves' });
const flash = who => ({ type: 'flash', who });
function* sayAll(arr, who) { for (const t of arr) yield say(t, who); }

function run(fn) { S.gen = fn(); S.val = undefined; advance(undefined); }
function advance(v) {
  const r = S.gen.next(v);
  if (r.done) { S.gen = null; S.cmd = null; return; }
  S.cmd = r.value; S.t = 0;
  const c = S.cmd;
  if (c.type === 'say') {
    const lines = wrap(fmt(c.t), 146, 7), pages = [];
    for (let i = 0; i < lines.length; i += 3) pages.push(lines.slice(i, i + 3));
    S.tb = { pages, pi: 0, shown: 0, who: c.who ? fmt(c.who) : null };
  } else if (c.type === 'ask') {
    S.ch = { q: fmt(c.q), opts: c.opts.map(fmt), i: 0 };
  } else if (c.type === 'card') {
    const lines = []; c.lines.forEach(l => wrap(fmt(l), 148, 7).forEach(x => lines.push(x)));
    const cap = 11, pages = [];
    for (let i = 0; i < lines.length; i += cap) pages.push(lines.slice(i, i + cap));
    if (!pages.length) pages.push(['']);
    S.card = { title: fmt(c.title), pages, pi: 0 };
  } else if (c.type === 'warp') {
    G.fade = { t: 0, phase: 'out', to: c };
  } else if (c.type === 'bmenu') { S.bm = 0; }
  else if (c.type === 'bmoves') { S.mv = 0; }
  else if (c.type === 'flash') { B.flash = { who: c.who, t: 24 }; if (c.who === 'player') B.shake = 10; }
}

/* ---------- save ---------- */
function save() {
  try {
    localStorage.setItem('tq_save_v1', JSON.stringify({ moves: G.moves, badges: G.badges, flags: G.flags, map: G.map, x: G.x, y: G.y, dir: G.dir }));
    SAVED = true;
  } catch (e) { /* storage may be unavailable */ }
}
function loadSave() {
  try {
    const s = JSON.parse(localStorage.getItem('tq_save_v1') || 'null');
    if (!s || !MAPS[s.map]) return false;
    G.moves = s.moves; G.badges = s.badges; G.flags = s.flags; G.map = s.map; G.x = s.x; G.y = s.y; G.dir = s.dir;
    G.mv = null; G.hp = maxHp(); return true;
  } catch (e) { return false; }
}
let SAVED = null;
function hasSave() {
  if (SAVED === null) { try { SAVED = !!localStorage.getItem('tq_save_v1'); } catch (e) { SAVED = false; } }
  return SAVED;
}

function drawPerson(x, y, dir, frame, l) {
  l = l || {};
  const hair = l.hair === undefined ? 3 : l.hair, shirt = l.shirt === undefined ? 2 : l.shirt;
  rect(x + 4, y + 14, 8, 2, 1);
  const f = frame % 2;
  // legs
  rect(x + 5, y + 13 + (f ? 0 : 1), 2, 3 - (f ? 0 : 1), 3);
  rect(x + 9, y + 13 + (f ? 1 : 0), 2, 3 - (f ? 1 : 0), 3);
  // body
  rect(x + 4, y + 9, 8, 5, 3); rect(x + 5, y + 10, 6, 3, shirt);
  if (l.cheer) { rect(x + 2, y + 4, 2, 7, 3); rect(x + 12, y + 4, 2, 7, 3); rect(x + 2, y + 3, 2, 1, 0); rect(x + 12, y + 3, 2, 1, 0); }
  else { rect(x + 3, y + 10, 1, 3, 3); rect(x + 12, y + 10, 1, 3, 3); }
  // head
  rect(x + 4, y + 1, 8, 8, 3);
  if (dir === 'up') {
    rect(x + 5, y + 2, 6, 6, hair);
    rect(x + 6, y + 3, 2, 2, 2); rect(x + 9, y + 5, 1, 1, 2);
    if (l.mullet) { rect(x + 5, y + 9, 6, 3, hair); rect(x + 7, y + 10, 2, 1, 2); }
  } else if (dir === 'down') {
    rect(x + 5, y + 2, 6, 6, 0);
    rect(x + 4, y + 1, 8, 4, hair);
    if (l.mullet) { rect(x + 3, y + 3, 1, 5, hair); rect(x + 12, y + 3, 1, 5, hair); }
    if (l.glasses) {
      rect(x + 5, y + 5, 3, 3, 2); rect(x + 8, y + 5, 3, 3, 2);
      rect(x + 6, y + 6, 1, 1, 3); rect(x + 9, y + 6, 1, 1, 3);
    } else { rect(x + 6, y + 6, 1, 1, 3); rect(x + 9, y + 6, 1, 1, 3); }
  } else {
    const L = dir === 'left';
    rect(x + (L ? 5 : 6), y + 3, 5, 5, 0);
    rect(x + 4, y + 1, 8, 3, hair);
    rect(x + (L ? 8 : 4), y + 3, 4, 6, hair);
    if (l.mullet) rect(x + (L ? 9 : 4), y + 8, 3, 4, hair);
    const ex = L ? x + 6 : x + 9;
    if (l.glasses) { rect(ex - 1, y + 4, 3, 3, 2); rect(ex, y + 5, 1, 1, 3); }
    else rect(ex, y + 5, 1, 1, 3);
  }
}

/* ---------- tiles ---------- */
function drawTile(ch, x, y, tx, ty) {
  const h = (tx * 7 + ty * 13) % 5;
  switch (ch) {
    case '.': rect(x, y, 16, 16, 1);
      if (h === 0) rect(x + 3, y + 4, 2, 1, 0); if (h === 1) rect(x + 10, y + 9, 1, 2, 2);
      if (h === 2) rect(x + 6, y + 11, 2, 1, 0); if (h === 3) rect(x + 12, y + 3, 1, 2, 2); break;
    case '_': rect(x, y, 16, 16, 0); if (h < 2) rect(x + 4 + h * 5, y + 6, 2, 1, 1); if (h === 3) rect(x + 9, y + 12, 3, 1, 1); break;
    case 'T': rect(x, y, 16, 16, 1); rect(x + 2, y + 1, 12, 11, 3); rect(x + 3, y + 2, 10, 9, 2);
      rect(x + 4, y + 3, 3, 2, 1); rect(x + 7, y + 12, 2, 4, 3); break;
    case 'R': rect(x, y, 16, 16, 3); for (let i = 0; i < 4; i++) rect(x, y + 2 + i * 4, 16, 2, 2); break;
    case 'W': rect(x, y, 16, 16, 0); rect(x, y + 15, 16, 1, 1); rect(x + 7, y, 1, 16, 1); break;
    case 'V': rect(x, y, 16, 16, 0); rect(x + 3, y + 3, 10, 9, 3); rect(x + 4, y + 4, 8, 7, 1); rect(x + 7, y + 4, 2, 7, 3); rect(x + 4, y + 7, 8, 1, 3); break;
    case 'D': rect(x, y, 16, 16, 0); rect(x + 3, y + 1, 10, 15, 3); rect(x + 4, y + 2, 8, 14, 2); rect(x + 10, y + 9, 2, 2, 0); break;
    case 'f': rect(x, y, 16, 16, 0); rect(x, y, 16, 1, 1); rect(x, y, 1, 16, 1); break;
    case '#': rect(x, y, 16, 16, 2); rect(x, y + 15, 16, 1, 3); rect(x, y + 7, 16, 1, 3); rect(x + 8, y, 1, 7, 3); break;
    case 'B': rect(x, y, 16, 16, 2); rect(x + 3, y, 10, 13, 3); rect(x + 4, y + 1, 8, 11, 1); rect(x + 6, y + 3, 4, 4, 0); rect(x + 7, y + 8, 2, 2, 3); break;
    case 'c': rect(x, y, 16, 16, 0); rect(x, y + 3, 16, 10, 3); rect(x, y + 4, 16, 8, 2); rect(x, y + 4, 16, 2, 1); break;
    case 'n': rect(x, y, 16, 16, 2); rect(x + 1, y + 2, 14, 12, 3); rect(x + 2, y + 3, 12, 10, 0);
      rect(x + 3, y + 4, 4, 4, 1); rect(x + 8, y + 4, 5, 3, 1); rect(x + 4, y + 9, 8, 2, 1); rect(x + 4, y + 4, 2, 1, 3); rect(x + 9, y + 4, 2, 1, 3); break;
    case 'd': rect(x, y, 16, 16, 2); rect(x + 2, y + 6, 12, 10, 3); rect(x + 4, y + 8, 8, 8, 1); break;
    case 'r': rect(x, y, 16, 16, 1); rect(x + 1, y + 1, 14, 14, 0); rect(x + 3, y + 3, 10, 10, 1); break;
    case 's': rect(x, y, 16, 16, curMap().name === 'over' ? 1 : 0); rect(x + 7, y + 8, 2, 7, 3); rect(x + 2, y + 2, 12, 8, 3); rect(x + 3, y + 3, 10, 6, 0); rect(x + 4, y + 5, 8, 1, 2); rect(x + 4, y + 7, 6, 1, 2); break;
    default: rect(x, y, 16, 16, 0);
  }
}

/* ---------- scripts ---------- */
function npcDone(flag) { return !!G.flags[flag]; }
function gainMove(id) {
  if (!G.moves.includes(id)) G.moves.push(id);
}
function* learnMove(id) {
  const m = MOVES[id];
  jingle([523, 659, 784, 1047]);
  const had = G.moves.includes(id);
  gainMove(id);
  yield say(had ? '{P} makes ' + m.name + ' a habit, for good.' : '{P} learned ' + m.name + '!');
  yield card('NEW MOVE: ' + m.name, ['RULE', m.rule, '', 'USE IT WHEN', m.when, '', 'CHECK-IN QUESTION', m.check]);
}

function* battleFlow(id) {
  const b = BOSSES[id];
  G.mode = 'battle';
  G.hp = maxHp();
  B = { id, b, hp: b.hp, max: b.hp, hpShow: b.hp, php: G.hp, phpShow: G.hp, phase: 1, flash: null, shake: 0, t: 0 };
  yield* sayAll(['A challenger blocks the way! ' + b.name + ' wants a battle.']);
  while (true) {
    const c = yield bmenu();
    if (c === 1) {
      yield say(b.hint);
      if (b.teaches && !G.moves.includes(b.teaches)) {
        jingle([523, 659, 784]);
        yield say('A thought from the semester surfaces. {P} remembers ' + MOVES[b.teaches].name + '. New move added to the FIGHT list!');
        gainMove(b.teaches);
      }
      continue;
    }
    const mv = yield bmoves();
    if (mv === null) continue;
    const M = MOVES[mv];
    yield say('{P} uses ' + M.name + '!');
    let mult = 1, note = null;
    if (b.weak.includes(mv)) { mult = 2.2; note = b.weakText; }
    else if (b.semi && b.semi.includes(mv)) { mult = 1.5; note = b.semiText || 'That helps a little.'; }
    else if (b.resist && b.resist.includes(mv)) { mult = 0.5; note = b.resistText; }
    const dmg = Math.max(1, Math.round(rnd(M.base[0], M.base[1]) * mult));
    sfx(mult > 1 ? 440 : 220, 0.12, 'square', 0.05, mult > 1 ? 300 : -60);
    yield flash('enemy');
    B.hp = Math.max(0, B.hp - dmg);
    if (note) yield say(note);
    if (M.recoil) { B.php = Math.max(0, B.php - M.recoil); yield say('Pushing hard costs ' + M.recoil + ' Resolve.'); }
    if (M.heal) { B.php = Math.min(maxHp(), B.php + M.heal); yield say('A clear record steadies {P}. Resolve restored a bit.'); }
    if (B.php <= 0) { yield say('{P} runs out of Resolve...'); G.mode = 'world'; return 'lose'; }
    if (b.phase2 && B.phase === 1 && B.hp <= b.hp / 2 && B.hp > 0) { B.phase = 2; yield say(b.phase2); }
    if (B.hp <= 0) break;
    const at = pick(B.phase === 2 && b.attacks2 ? b.attacks2 : b.attacks);
    yield say(at.text);
    const d = rnd(at.dmg[0], at.dmg[1]);
    sfx(150, 0.15, 'sawtooth', 0.05, -80);
    yield flash('player');
    B.php = Math.max(0, B.php - d);
    if (B.php <= 0) { yield say('{P} runs out of Resolve...'); G.mode = 'world'; return 'lose'; }
  }
  jingle([392, 523, 659, 784]);
  yield* sayAll(b.win);
  G.mode = 'world';
  return 'win';
}

function bossScript(id, home) {
  const b = BOSSES[id];
  return function* () {
    if (G.badges.includes(id)) { yield say('The hall is quiet now. ' + b.name + ' nods at you.', b.name); return; }
    yield* sayAll(b.pre, b.name);
    const r = yield* battleFlow(id);
    if (r === 'win') {
      G.badges.push(id); G.hp = maxHp();
      yield say('{P} earned the ' + b.gym + ' badge! Resolve rose to ' + maxHp() + '.');
      if (b.teaches) yield* learnMove(b.teaches);
      save();
      if (id === 'quiet') yield* epilogue();
      else if (G.badges.filter(x => x !== 'quiet').length === 4 && G.moves.includes('speakup')) yield say('All four halls cleared. The Hindsight Tower is open.');
      else if (G.badges.filter(x => x !== 'quiet').length === 4) yield say('All four halls cleared. Something is missing before the Hindsight Tower. Visit the Principles Hall.');
    } else {
      G.hp = maxHp();
      yield say('{P} steps outside to regroup. Try a different move, or press THINK for a hint.');
      yield warp(home.map, home.x, home.y, 'up');
    }
  };
}

/* ---------- build the world ---------- */
function buildWorld() {
  const over = makeOver(); MAPS.over = over;
  const halls = [
    { id: 'mirror', sign: 'MIRROR HALL: Principle 2, Self-Awareness and Continual Growth. Boss: THE MIRROR.', look: BOSSES.mirror.look },
    { id: 'promise', sign: 'PROMISE HALL: Principle 1, Personal Ownership. Boss: THE PROMISE.' },
    { id: 'problem', sign: 'PROBLEM HALL: Principle 3, Find the Right Problems. Boss: THE FLYER PRINTER.' },
    { id: 'rock', sign: 'VALUE HALL: Principle 6, Relentless Focus on Value. Boss: THE SHINY ROCK.' }
  ];
  halls.forEach((hl, i) => {
    const dx = DOORS[i], room = makeRoom(hl.id, 4);
    MAPS[hl.id] = room;
    for (let y = 3; y <= 7; y++) room.g[y][4] = 'r';
    over.warps.push({ x: dx, y: 4, to: hl.id, tx: 4, ty: 7, dir: 'up' });
    room.warps.push({ x: 4, y: 8, to: 'over', tx: dx, ty: 5, dir: 'down' });
    over.g[5][dx - 1] = 's';
    over.interact[(dx - 1) + ',5'] = function* () { yield say(hl.sign); };
    const b = BOSSES[hl.id];
    room.npcs.push({ x: 4, y: 2, dir: 'down', look: b.look, name: b.name, script: bossScript(hl.id, { map: hl.id, x: 4, y: 7 }), boss: true });
    room.triggers.push({ x: 4, y: 5, cond: () => !G.badges.includes(hl.id), script: bossScript(hl.id, { map: hl.id, x: 4, y: 7 }) });
  });
  const hints = {
    mirror: ['The Mirror only reflects what you already believe. Pushing harder will not crack it. Think about what a good question sounds like.', '{P}: So the boss fight is... introspection. Great. Very comfortable.'],
    promise: ['The Promise never writes anything down. Dates said out loud and a backup plan are its weakness.', '{P}: Said out loud. To people. Noted.'],
    problem: ['The Flyer Printer solves every problem at top speed. Try slowing down and asking who is outside the team.'],
    rock: ['The Shiny Rock is dazzling. A real client does not care about dazzle, only about the decision they have to make.']
  };

/* ---------- world logic ---------- */
function npcAt(x, y) { return curMap().npcs.find(n => n.x === x && n.y === y); }
function passable(x, y) {
  const m = curMap();
  if (x < 0 || y < 0 || x >= m.w || y >= m.h) return false;
  if (BLOCK.has(m.g[y][x])) return false;
  if (npcAt(x, y)) return false;
  return true;
}
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

function tryInteract() {
  const d = DIRS[G.dir], tx = G.x + d[0], ty = G.y + d[1], m = curMap();
  const n = npcAt(tx, ty);
  if (n) {
    const od = n.dir;
    n.dir = G.dir === 'up' ? 'down' : G.dir === 'down' ? 'up' : G.dir === 'left' ? 'right' : 'left';
    run(function* () { yield* n.script(); n.dir = od; });
    return;
  }
  const it = m.interact[tx + ',' + ty];
  if (it) run(it);
}
function afterStep() {
  const m = curMap();
  const w = m.warps.find(w => w.x === G.x && w.y === G.y);
  if (w) {
    if (w.cond && !w.cond()) { run(w.fail); return; }
    run(function* () { yield warp(w.to, w.tx, w.ty, w.dir); });
    return;
  }
  const t = m.triggers.find(t => t.x === G.x && t.y === G.y && t.cond());
  if (t) run(t.script);
}

function startNew() {
  buildWorld();
  G.mode = 'world'; G.map = 'over'; G.x = 12; G.y = 17; G.dir = 'up'; G.moves = ['push', 'notes']; G.badges = []; G.flags = {}; G.hp = 60; G.mv = null;
  run(function* () {
    yield say('{GUIDE}: Welcome, Trailblazer. This semester you take on a real client, and a few hard lessons about leading when nobody hands you a title.', '{GUIDE}');
    yield say('{P}: Great. A leadership class with boss fights. Very on brand.');
    yield say('{P}: In August I was not sure what strategic leadership even meant. I knew anyone can lead without being the boss. And from being an Eagle Scout, a Business Scholars Ambassador and a Delta Chi exec, I knew it meant stepping back for the 20,000 foot view.');
    yield say('{GUIDE}: Good start. Four halls will test it. Each leader guards a habit worth keeping. Beat them, then keep what you learn.', '{GUIDE}');
    yield say('Your lessons go in the Playbook, in the MENU. Walk up to anything and press A.', '{GUIDE}');
  });
}
function continueGame() {
  buildWorld();
  if (!loadSave()) { startNew(); return; }
  if (G.flags.finished) setCrowd();
  G.mode = 'world';
}

/* ---------- menu ---------- */
const MENU_ITEMS = ['PLAYBOOK', 'SHEET', 'REFLECTIONS', 'CREDITS', 'SAVE', 'SOUND', 'CLOSE'];
function playbookLines() {
  const L = [];
  const learned = G.moves.filter(m => MOVES[m].learned);
  if (!learned.length) return ['No lessons yet. Beat a boss, or finish a scene with the team, to learn a move.'];
  learned.forEach(id => {
    const m = MOVES[id];
    L.push(m.name, 'RULE: ' + m.rule, 'WHEN: ' + m.when, 'CHECK-IN: ' + m.check, '');
  });
  return L;
}
function openMenuItem(i) {
  const it = MENU_ITEMS[i];
  G.menuOpen = false;
  if (it === 'PLAYBOOK') run(function* () { yield card('PLAYBOOK', playbookLines()); });
  else if (it === 'SHEET') run(function* () { yield card('SHEET', SHEET); });
  else if (it === 'REFLECTIONS') run(function* () { for (const r of REFLECTIONS) yield card('REFLECTION ' + r.title, r.lines); });
  else if (it === 'CREDITS') run(function* () { yield card('CREDITS', CREDITS); });
  else if (it === 'SAVE') { save(); run(function* () { yield say('Progress saved on this device.'); }); }
  else if (it === 'SOUND') { MUTE = !MUTE; G.menuOpen = true; }
}

/* ---------- update ---------- */
let B = null;
function update() {
  G.frame++;
  if (G.fade) { tapq.length = 0; updateFade(); return; }
  if (G.mode === 'title') { tapq.length = 0; updateTitle(); return; }
  if (S.gen) { tapq.length = 0; updateScript(); return; }
  if (G.menuOpen) { tapq.length = 0; updateMenu(); return; }
  if (G.mode !== 'world') return;
  if (hit('menu')) { G.menuOpen = true; G.menuIdx = 0; sfx(600, 0.05); return; }
  if (G.mv) {
    G.mv.t += 1.25;
    if (G.mv.t >= 16) { G.x = G.mv.tx; G.y = G.mv.ty; G.mv = null; afterStep(); }
    return;
  }
  if (hit('a')) { tryInteract(); return; }
  let d = null;
  for (const k of ['up', 'down', 'left', 'right']) { if (held[k]) { d = k; break; } }
  if (d) tapq.length = 0; else if (tapq.length) d = tapq.shift();
  if (d) {
    G.dir = d;
    const v = DIRS[d], tx = G.x + v[0], ty = G.y + v[1];
    if (passable(tx, ty)) G.mv = { tx, ty, dx: v[0], dy: v[1], t: 0 };
  }
}
function updateFade() {
  const f = G.fade;
  f.t += 1;
  if (f.phase === 'out' && f.t >= 14) {
    const w = f.to; G.map = w.map; G.x = w.x; G.y = w.y; G.dir = w.dir || 'down'; G.mv = null;
    f.phase = 'in'; f.t = 0;
  } else if (f.phase === 'in' && f.t >= 14) { G.fade = null; if (S.gen) advance(undefined); }
}
function updateTitle() {
  if (hit('up') || hit('down')) { if (hasSave()) G.titleIdx = 1 - G.titleIdx; sfx(500, 0.04); }
  if (hit('a')) {
    sfx(700, 0.08);
    if (G.titleIdx === 1 && hasSave()) continueGame(); else startNew();
  }
}
function updateMenu() {
  if (hit('menu') || hit('b')) { G.menuOpen = false; return; }
  if (hit('up')) { G.menuIdx = (G.menuIdx + MENU_ITEMS.length - 1) % MENU_ITEMS.length; sfx(500, 0.03); }
  if (hit('down')) { G.menuIdx = (G.menuIdx + 1) % MENU_ITEMS.length; sfx(500, 0.03); }
  if (hit('a')) openMenuItem(G.menuIdx);
}
function updateScript() {
  const c = S.cmd; if (!c) return;
  S.t++;
  if (B) { if (B.flash && --B.flash.t <= 0) B.flash = null; if (B.shake > 0) B.shake--; }
  if (c.type === 'say') {
    const tb = S.tb, page = tb.pages[tb.pi], total = page.join('').length;
    if (tb.shown < total) {
      const sp = held.a ? 3 : 1;
      if (S.t % 2 === 0 || held.a) { tb.shown = Math.min(total, tb.shown + sp); if (tb.shown % 3 === 0) sfx(800, 0.015, 'square', 0.012); }
      if (hit('a') || hit('b')) tb.shown = total;
    } else if (hit('a') || hit('b')) {
      if (tb.pi < tb.pages.length - 1) { tb.pi++; tb.shown = 0; } else { S.tb = null; advance(undefined); }
    }
  } else if (c.type === 'ask') {
    const ch = S.ch;
    if (hit('up')) ch.i = (ch.i + ch.opts.length - 1) % ch.opts.length;
    if (hit('down')) ch.i = (ch.i + 1) % ch.opts.length;
    if (hit('a')) { const v = ch.i; S.ch = null; advance(v); }
  } else if (c.type === 'wait') {
    if (S.t >= c.n) advance(undefined);
  } else if (c.type === 'flash') {
    if (S.t >= 22) advance(undefined);
  } else if (c.type === 'card') {
    const cd = S.card;
    if (hit('left') && cd.pi > 0) cd.pi--;
    if (hit('right') && cd.pi < cd.pages.length - 1) cd.pi++;
    if (hit('a')) { if (cd.pi < cd.pages.length - 1) { cd.pi++; sfx(600, 0.03); } else { S.card = null; advance(undefined); } }
    if (hit('b')) { S.card = null; advance(undefined); }
  } else if (c.type === 'bmenu') {
    if (hit('up') || hit('down') || hit('left') || hit('right')) { S.bm = 1 - S.bm; sfx(500, 0.03); }
    if (hit('a')) advance(S.bm);
  } else if (c.type === 'bmoves') {
    const n = G.moves.length;
    if (hit('up')) S.mv = (S.mv + n - 1) % n;
    if (hit('down')) S.mv = (S.mv + 1) % n;
    if (hit('a')) advance(G.moves[S.mv]);
    if (hit('b')) advance(null);
  } else if (c.type === 'warp') {
    /* handled by fade */
  }
}

/* ---------- drawing ---------- */
function drawWorld() {
  const m = curMap();
  const ppx = G.x * TS + (G.mv ? G.mv.dx * G.mv.t : 0), ppy = G.y * TS + (G.mv ? G.mv.dy * G.mv.t : 0);
  let cx = m.w * TS <= VW ? -(VW - m.w * TS) / 2 : Math.max(0, Math.min(m.w * TS - VW, ppx + 8 - VW / 2));
  let cy = m.h * TS <= VH ? -(VH - m.h * TS) / 2 : Math.max(0, Math.min(m.h * TS - VH, ppy + 8 - VH / 2));
  cx = Math.round(cx); cy = Math.round(cy);
  rect(0, 0, VW, VH, 3);
  const x0 = Math.max(0, Math.floor(cx / TS)), y0 = Math.max(0, Math.floor(cy / TS));
  const x1 = Math.min(m.w - 1, Math.floor((cx + VW) / TS)), y1 = Math.min(m.h - 1, Math.floor((cy + VH) / TS));
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) drawTile(m.g[y][x], x * TS - cx, y * TS - cy, x, y);
  const ents = m.npcs.map(n => ({ y: n.y * TS, draw: () => {
    const bob = n.cheer ? -Math.abs(Math.round(Math.sin((G.frame + (n.phase || 0)) / 5) * 3)) : 0;
    drawPerson(n.x * TS - cx, n.y * TS - cy - 2 + bob, n.dir, n.cheer ? (G.frame >> 3) : 0, n.look);
  } }));
  ents.push({ y: ppy, draw: () => drawPerson(Math.round(ppx) - cx, Math.round(ppy) - cy - 2, G.dir, G.mv ? Math.floor(G.mv.t / 4) : 0, QUINN) });
  ents.sort((a, b) => a.y - b.y).forEach(e => e.draw());
  if (m.name === 'tower' && G.flags.finished || (m.name === 'tower' && m.npcs.some(n => n.cheer))) {
    for (let i = 0; i < 36; i++) {
      const px = (i * 37 + G.frame * (0.4 + (i % 3) * 0.3)) % VW, py = (i * 53 + G.frame * (0.8 + (i % 2) * 0.5)) % VH;
      rect(Math.floor(px), Math.floor(py), 2, 2, [1, 2, 3][i % 3]);
    }
  }
}

  text('LEADERSHIP PLAN', 80, 53, 2, 'center', 7);
  drawPerson(72, 74, 'down', (G.frame >> 4), QUINN);
  const items = hasSave() ? ['NEW GAME', 'CONTINUE'] : ['PRESS A TO START'];
  items.forEach((it, i) => text((items.length > 1 && G.titleIdx === i ? '> ' : '') + it, 80, 94 + i * 10, 3, 'center', 7));
  text('by ' + CAST.AUTHOR, 80, 134, 0, 'center', 6);
}
function draw() {
  ctx.setTransform(4, 0, 0, 4, 0, 0);
  ctx.imageSmoothingEnabled = false;
  if (G.mode === 'title') { drawTitle(); }
  else if (G.mode === 'battle' && B) { drawBattle(); drawBattleMenus(); drawTextbox(); drawChoice(); }
  else {
    drawWorld();
    if (S.card) drawCard();
    drawTextbox(); drawChoice();
    if (G.menuOpen) drawMenu();
  }
  if (G.mode === 'battle' && S.card) drawCard();
  if (G.fade) {
    const a = G.fade.phase === 'out' ? G.fade.t / 14 : 1 - G.fade.t / 14;
    ctx.globalAlpha = Math.max(0, Math.min(1, a)); rect(0, 0, VW, VH, 3); ctx.globalAlpha = 1;
  }
}

/* ---------- main loop ---------- */
let last = 0, acc = 0;
function frame(t) {
  acc += Math.min(100, t - last); last = t;
  while (acc >= 1000 / 60) { update(); for (const k in hitq) hitq[k] = false; acc -= 1000 / 60; }
  draw();
  requestAnimationFrame(frame);
}
buildWorld();
window.__TQ = { G, S, update, draw, press, release, hit, startNew, continueGame, BOSSES, MOVES, MAPS, get B() { return B; }, run, fmt };
requestAnimationFrame(t => { last = t; frame(t); });
</script>
